<html>
<head>
<title>Food Menu</title>
<style>

      body{
        background:#fffcf0;
        font-family:Arial;
        margin:0;
        padding-bottom:60px
      }

      h2{
        text-align:center;
        color:#c2952a
      }

      .item{
        padding:15px;
        display:grid;
        grid-template-columns:1fr 1fr 1fr 1fr;
        gap:15px
      }

      .food{
        background:white;
        border:1px solid #ddd;
        border-radius:8px;
        text-align:center;
        padding-bottom:15px
      }

      .food img{
        width:100%;
        height:140px;
        object-fit:cover;
        display:block
      }

      .food h3{
        color:#000;
        font-size:15px;
        margin:10px 0 5px 0
      }

      .price{
        color:#555;
        font-size:14px;
        margin:5px 0
      }

      .food button{
        background:#ffcc00;
        border:none;
        padding:6px 14px;
        border-radius:5px;
        font-size:13px;
        font-weight:bold
      }

      .footer-nav{
        position:fixed;
        bottom:0;
        left:0;
        width:100%;
        background:white;
        border-top:1px solid #ddd;
        display:flex;
        justify-content:space-around;
        padding:12px 0;
        font-size:14px;
        color:gray
      }

      .footer-nav a{
        text-decoration:none;
        color:gray
      }

      .footer-nav a:hover{
        color:black;
        font-weight:bold
      }

</style>
</head>
<body>

<h2>Our Foods</h2>

<div class="item">

        <div class="food">
            <img src="burger1.jpg" alt="Burger">
            <h3>Burger</h3>
            <p class="price">Rs.150</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="pizza.jpg" alt="Pizza">
            <h3>Pizza</h3>
            <p class="price">Rs.250</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="pasta.jpg" alt="Pasta">
            <h3>Pasta</h3>
            <p class="price">Rs.200</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="salad.jpg" alt="Salad">
            <h3>Salad</h3>
            <p class="price">Rs.120</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="fries.jpg" alt="Fries">
            <h3>Fries</h3>
            <p class="price">Rs.80</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="cake.jpg" alt="Cake">
            <h3>Cake</h3>
            <p class="price">Rs.300</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="drink.jpg" alt="Drink">
            <h3>Drink</h3>
            <p class="price">Rs.60</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

        <div class="food">
            <img src="sandwich.jpg" alt="Sandwich">
            <h3>Sandwich</h3>
            <p class="price">Rs.100</p>
            <a href="order.html"><button>Buy Now</button></a>
        </div>

</div>

<div class="footer-nav">
  <a href="home.html">Home</a>
  <a href="menu.html"><b style="color: #000;">menu</b></a>

</div>

</body>
</html>
