<!DOCTYPE html>
<html>
<head>
    <title>GreenNest - Sign Up</title>

    <style>
        body {
            background: #e8f5e9;
            font-family: Arial;
            text-align: center;
        }

        .box {
            background: white;
            width: 300px;
            margin: 70px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background:#c2952a;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }

        a {
            color:#c2952a;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Yummy Cafe</h1>
    <h2>Sign Up</h2>

    <form action="login.html">
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Create Password" required>

        <button type="submit">Sign Up</button>
    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login Here</a>
</div>

</body>
</html>
