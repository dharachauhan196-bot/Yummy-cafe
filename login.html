<!DOCTYPE html>
<html>
<head>
    <title>yummy - Login</title>

    <style>
        body {
            background: #e8f5e9;
            font-family: Arial;
            text-align: center;
        }

        .box {
            background: white;
            width: 300px;
            margin: 70px auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            background:#c2952a;
            color: white;
            padding: 10px 25px;
            border: none;
            cursor: pointer;
        }

        a {
            color: #2e7d32;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>Yummy cafe</h1>
    <h2>Login</h2>

    <form action="home.html">
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p>New user?</p>
    <a href="index.html">Create Account</a>
</div>

</body>
</html>
